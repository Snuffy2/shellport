name: Publish Docker Image

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && format('{0}-main-edge', github.workflow) || format('{0}-release-publishers', github.workflow) }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: snuffy2/shellport

jobs:
  publish:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=edge,branch=main,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve existing release image version
        id: existing
        if: github.event_name == 'release'
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$IMAGE_TAG" || "$IMAGE_TAG" == "latest" ]]; then
            printf 'release did not produce a semantic image version\n' >&2
            exit 1
          fi

          response_dir="$RUNNER_TEMP/ghcr-version-check"
          mkdir -p "$response_dir"
          token_status="$(curl --silent --show-error --output "$response_dir/token" --write-out '%{http_code}' --user "$REGISTRY_USERNAME:$REGISTRY_TOKEN" --get --data-urlencode "service=$REGISTRY" --data-urlencode "scope=repository:$IMAGE_NAME:pull" "https://$REGISTRY/token")"
          if [[ "$token_status" != "200" ]]; then
            printf 'GHCR token request returned HTTP %s\n' "$token_status" >&2
            exit 1
          fi

          registry_bearer="$(jq -er '.token // .access_token' "$response_dir/token")"
          test -n "$registry_bearer"
          manifest_status="$(curl --silent --show-error --dump-header "$response_dir/headers" --output "$response_dir/manifest" --write-out '%{http_code}' --header "Authorization: Bearer $registry_bearer" --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' "https://$REGISTRY/v2/$IMAGE_NAME/manifests/$IMAGE_TAG")"
          case "$manifest_status" in
            404)
              printf 'exists=false\n' >> "$GITHUB_OUTPUT"
              printf 'Release image version %s is absent; publication may proceed.\n' "$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
              ;;
            200)
              registry_digest="$(tr -d '\r' < "$response_dir/headers" | awk 'tolower($1) == "docker-content-digest:" { digest = $2 } END { print digest }')"
              if [[ ! "$registry_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                printf 'GHCR returned an invalid content digest for release image version %s\n' "$IMAGE_TAG" >&2
                exit 1
              fi
              manifest_digest="sha256:$(sha256sum "$response_dir/manifest" | awk '{ print $1 }')"
              if [[ "$registry_digest" != "$manifest_digest" ]]; then
                printf 'GHCR content digest does not match release image version %s manifest\n' "$IMAGE_TAG" >&2
                exit 1
              fi
              printf 'exists=true\ndigest=%s\n' "$registry_digest" >> "$GITHUB_OUTPUT"
              printf 'Release image version %s already exists with verified digest %s; reusing it.\n' "$IMAGE_TAG" "$registry_digest" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              printf 'GHCR manifest lookup returned HTTP %s for release image version %s\n' "$manifest_status" "$IMAGE_TAG" >&2
              exit 1
              ;;
          esac
      - id: build
        if: github.event_name == 'push' || steps.existing.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SHELLPORT_VERSION=${{ steps.meta.outputs.version }}
            SHELLPORT_SOURCE_URL=https://github.com/Snuffy2/shellport/archive/${{ github.sha }}.tar.gz
      - name: Publish latest stable release alias
        id: latest
        if: github.event_name == 'release' && !github.event.release.prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IMAGE_DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          latest_release_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [[ "$latest_release_tag" == "$RELEASE_TAG" ]]; then
            if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              printf 'build did not produce a valid image digest\n' >&2
              exit 1
            fi
            docker buildx imagetools create --tag "$REGISTRY/$IMAGE_NAME:latest" "$REGISTRY/$IMAGE_NAME@$IMAGE_DIGEST"
            printf 'publish_latest=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'publish_latest=false\n' >> "$GITHUB_OUTPUT"
            printf 'Skipping latest: current stable release is %s, not %s.\n' "$latest_release_tag" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          fi
