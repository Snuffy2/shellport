name: Renovate Update Font Assets

on:
  push:
    branches:
      - renovate/*
    paths:
      - ui/fonts/JetBrainsMonoNerdFont/manifest.json

permissions:
  contents: write

concurrency:
  group: renovate-font-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-font-assets:
    name: Update bundled font assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Update bundled JetBrainsMono Nerd Font
        run: npm run update:fonts

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update bundled JetBrainsMono Nerd Font"
          file_pattern: ui/fonts/JetBrainsMonoNerdFont
