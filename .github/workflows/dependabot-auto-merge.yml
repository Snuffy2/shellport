name: Dependabot npm auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: dependabot-npm-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-npm-dependencies:
    if: >-
      github.event.repository.fork == false &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/npm_and_yarn/') &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify that only npm dependency files changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          changed_files="$(gh api --paginate \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename')"
          while IFS= read -r changed_file; do
            case "${changed_file}" in
              package.json | package-lock.json) ;;
              *)
                echo "Refusing auto-merge; changed files were:"
                echo "${changed_files}"
                exit 1
                ;;
            esac
          done <<< "${changed_files}"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  enable-auto-merge:
    needs: verify-npm-dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash --match-head-commit "${HEAD_SHA}" "${PR_URL}"

  disable-auto-merge:
    if: >-
      always() &&
      needs.verify-npm-dependencies.result != 'success' &&
      github.event.repository.fork == false &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/npm_and_yarn/') &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    needs: verify-npm-dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Disable an existing auto-merge request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          auto_merge_enabled="$(gh pr view "${PR_URL}" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [[ "${auto_merge_enabled}" == true ]]; then
            gh pr merge --disable-auto "${PR_URL}"
          else
            echo "Auto-merge is not enabled."
          fi
